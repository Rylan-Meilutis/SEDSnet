[env]
# Runtime-schema tests intentionally share one process-global registry. Keep
# the harness serial; concurrency behavior is exercised explicitly inside the
# dedicated multithreaded tests.
RUST_TEST_THREADS = "1"

[target.thumbv7em-none-eabihf]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=all",
    "-C", "link-arg=-Wl,--print-gc-sections",
    "-C", "link-arg=-Wl,-Map=firmware.map",
]
